[workspace]
resolver = "3"
members = [
  ".",
  "bins/*",
  "layers/physical",
  "layers/physical/encoding",
  "layers/physical/morse",
  "utils/*"
]

[workspace.dependencies]
encoding = { path = "layers/physical/encoding" }
morse = { path = "layers/physical/morse" }

interrupts = { path = "utils/interrupts" }
layer-physical = { path = "layers/physical" }
listening_pin = { path = "utils/listening_pin" }
process = { path = "utils/process" }
ringbuf = { path = "utils/ringbuf" }
time = { path = "utils/time" }

avr-device = { version = "0.8.1", features = ["atmega328p"] }
either = { version = "1.16.0", default-features = false }
embedded-hal = "1.0.0"
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }

[workspace.dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
opt-level = "s"
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
debug = true  # Symbols are stripped by flashing anyway
lto = true
panic = "abort"
codegen-units = 1
