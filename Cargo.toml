[package]
name = "http-over-morse"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[lib]
bench = false
test = false

[[bin]]
bench = false
name = "http-over-morse"
test = false

[dependencies]
avr-device = { version = "0.8.1", features = ["atmega328p"] }
embedded-hal = "1.0.0"
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }
panic-halt = "1.0.0"
phf = { version = "0.13.1", default-features = false }
ufmt = "0.2.0"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
opt-level = "s"
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
debug = true
lto = true
panic = "abort"
codegen-units = 1

[build-dependencies]
cargo-emit = "0.2.1"
itertools = "0.14.0"
phf = { version = "0.13.1", default-features = false }
phf_codegen = "0.13.1"
proc-macro2 = "1.0.106"
quote = "1.0.45"
