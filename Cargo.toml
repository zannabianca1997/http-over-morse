[package]
name = "http-over-morse"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
default-run = "wiretap"

[workspace]
resolver = "3"
members = [".", "encoding", "interrupts", "process", "ringbuf", "time"]

[workspace.dependencies]
avr-device = { version = "0.8.1", features = ["atmega328p"] }
embedded-hal = "1.0.0"
encoding = { path = "encoding" }
interrupts = { path = "interrupts" }
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }
process = { path = "process" }
ringbuf = { path = "ringbuf" }
time = { path = "time" }

[workspace.dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

[lib]
bench = false
test = false

[[bin]]
bench = false
name = "wiretap"
test = false

[dependencies]
arduino-hal.workspace = true
avr-device.workspace = true
either = { version = "1.16.0", default-features = false }
embedded-hal.workspace = true
encoding.workspace = true
interrupts.workspace = true
nb.workspace = true
nunny.workspace = true
panic-halt = "1.0.0"
process.workspace = true
ringbuf.workspace = true
time.workspace = true
ufmt = "0.2.0"

[build-dependencies]
cargo-emit = "0.2.1"

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
opt-level = "s"
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
debug = true
lto = true
panic = "abort"
codegen-units = 1
