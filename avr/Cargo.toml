[workspace]
resolver = "3"
members = []

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Mixed utils
either = { version = "1.16.0", default-features = false }
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }
zerocopy = { version = "0.8.50", features = ["derive"] }

# Generic HAL
embedded-hal = "1.0.0"

# AVR registers
avr-device = { version = "0.8.1", features = ["atmega328p"] }

# Arduino specific HAL
[workspace.dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "e5c8f37fe48419956e722490a82b9ca9b9fc61a2"
features = ["arduino-nano"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
opt-level = "s"
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
debug = true  # Symbols are stripped by flashing anyway
lto = true
panic = "abort"
codegen-units = 1
