[workspace]
resolver = "3"
members = ["bin/*", "hal", "utils/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Hardware abstraction layer
hal = { path = "hal" }

# Utils package
serial = { path = "utils/serial" }

# Utils from the common workspace
concurrency = { path = "../common/concurrency" }

# Mixed utils
either = { version = "1.16.0", default-features = false }
envparse = "0.1.0"
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }
zerocopy = { version = "0.8.50", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Configure the build for minimal size - AVRs have very little program memory
[profile.dev]
opt-level = "s"
lto = true
panic = "abort"

[profile.release]
opt-level = "s"
debug = true  # Symbols are stripped by flashing anyway
lto = true
panic = "abort"
codegen-units = 1
