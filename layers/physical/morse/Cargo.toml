[package]
name = "morse"
version = "0.1.0"
edition = "2024"

[lib]
bench = false
test = false

[dependencies]
nunny.workspace = true
time.workspace = true

[build-dependencies]
anyhow = "1.0.102"
cargo-emit.workspace = true
itertools = "0.14.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
rayon = "1.12.0"
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
stringcase = "0.4.0"
toml = "1.1.2"
