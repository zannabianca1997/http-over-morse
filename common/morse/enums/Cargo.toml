[package]
name = "morse-enums"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[build-dependencies]
cargo-emit.workspace = true
morse-build = { path = "../build" }
proc-macro2.workspace = true
quote.workspace = true

[lints]
workspace = true

# Computing LUT table is very intensive,
# better run it with optimizations

[profile.dev.build-override]
opt-level = 3
codegen-units = 1

[profile.release.build-override]
opt-level = 3
codegen-units = 1
