[workspace]
resolver = "3"
members = [
  "concurrency",
  "encoding",
  "lookup_hash",
  "morse/build",
  "morse/enums",
  "morse/symbol",
  "primes",
  "ringbuf"
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
concurrency = { path = "concurrency" }
itertools = "0.14.0"
lookup_hash = { path = "lookup_hash", default-features = false }
primes = { path = "primes" }
ringbuf = { path = "ringbuf" }

# General purpose

either = { version = "1.16.0", default-features = false }
nb = "1.1.0"
nunny = { version = "0.2.2", default-features = false }
zerocopy = { version = "0.8.50", features = ["derive"] }

# Code generation

cargo-emit = "0.2.1"
proc-macro2 = { version = "1.0.106", default-features = false }
quote = { version = "1.0.45", default-features = false }
syn = { version = "2.0.110", default-features = false, features = [
  "clone-impls",
  "full",
  "parsing",
  "printing"
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# Computing the LUT tables is very intensive, and it runs in build scripts:
# profiles are only valid at the workspace root
[profile.dev.build-override]
opt-level = 3
codegen-units = 1

[profile.release.build-override]
opt-level = 3
codegen-units = 1
